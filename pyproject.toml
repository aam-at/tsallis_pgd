[project]
name = "robust-segmentation"
version = "0.1.0"
description = "Repository for robust segmentation research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "albumentationsx>=2.1.1",
  "cityscapesscripts>=2.2.4",
  "colorama>=0.4.6",
  "einops>=0.8.2",
  "fastargs>=1.2.0",
  "ffcv==1.0.2",
  "ftfy>=6.3.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3",
  "hydra-core>=1.3.2",
  "hydra-optuna-sweeper>=1.2.0",
  "lightning>=2.6.1",
  "mmcv>=2.1.0",
  "mmsegmentation>=1.2.2",
  "nvidia-dali-cuda130>=2.0.0",
  "omegaconf>=2.3",
  "pillow>=10.0.0",
  "pyyaml>=6.0.3",
  "regex>=2026.3.32",
  "rich>=13.0",
  "rootutils>=1.0.7",
  "segmentation_attacks",
  "setuptools>=80,<81",
  "timm>=1.0.26",
  "torch>=2.10.0,<2.11.0",
  "torch_tensorrt>=2.10.0,<2.11.0",
  "torcheval>=0.0.7",
  "torchvision>=0.25.0",
  "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
  "autoflake>=2.3.1",
  "debugpy>=1.8.18",
  "epc>=0.0.5",
  "flake8>=7.1.2",
  "importmagic>=0.1.7",
  "ipython>=9.8.0",
  "isort>=7.0.0",
  "mypy>=1.19.1",
  "pudb>=2025.1.5",
  "pycodestyle>=2.12.1",
  "pylint>=4.0.4",
  "ruff>=0.14.9",
  "ty>=0.0.19",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
no-build-isolation-package = ["ffcv", "mmcv"]
no-binary-package = ["ffcv", "pillow"]
environments = ["sys_platform == 'linux' and python_version >= '3.13'"]

[tool.uv.sources]
segmentation_attacks = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
mmcv = { path = "./external/mmcv" }

[tool.uv.workspace]
members = ["packages/segmentation_attacks"]
